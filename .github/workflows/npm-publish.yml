name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "false"
        type: boolean

# Publish `flatsql` to npm only from GitHub Actions via OIDC trusted publishing.
# Do not attempt local `npm publish` for this package from developer machines.
# Required for NPM provenance / trusted publishing
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"
          actions-cache-folder: "emsdk-cache"

      - name: Clone FlatBuffers (DigitalArsenal pin)
        run: |
          git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
          git -C ../flatbuffers checkout c72a8bed83d2d1c6cf4c9d229c79fc795ec395ae

      - name: Build WASM
        working-directory: cpp
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --config Release

      - name: Copy WASM to dist
        run: |
          mkdir -p wasm
          mkdir -p sdm
          cp cpp/build-wasm/flatsql.js wasm/ || true
          cp cpp/build-wasm/flatsql.wasm wasm/ || true
          cp cpp/build-wasm/flatsql-wasi.wasm wasm/ || true
          cp cpp/build-wasm/flatsql-spatial.wasm sdm/ || true

      # The partition store artifact (A34): wasi-sdk 30, the same pinned
      # flatbuffers. The published bytes must be the committed bytes, so a
      # release commit carries the artifact its sources build.
      - name: Install wasi-sdk 30
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          echo "0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          cat /opt/wasi-sdk/VERSION

      - name: Build flatsql-ps-threads.wasm, check imports, write integrity.json
        env:
          WASI_SDK_PATH: /opt/wasi-sdk
          FLATSQL_BUILD_JOBS: '4'
        run: bash scripts/build-wasm.sh --ps

      - name: The published artifact is the committed artifact
        run: |
          sha256sum wasm/flatsql-ps-threads.wasm
          git diff --exit-code --stat -- wasm/flatsql-ps-threads.wasm
          node -e "const j=require('./wasm/integrity.json');console.log(JSON.stringify(j.files['flatsql-ps-threads.wasm']))"

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/
          ls -la wasm/ || true
          ls -la sdm/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dist/
            wasm/
            sdm/
            package.json
            README.md
            LICENSE
          retention-days: 1

  test:
    name: Test Package
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run WASI tests
        run: npm run test:wasi

      - name: Check import surfaces and integrity.json
        run: |
          npm run check:imports
          npm run check:integrity

      - name: No sql.js in the package's dependency tree
        run: |
          test "$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")" = "0"
          npm ls sql.js --omit=dev --omit=peer --omit=optional --all > /tmp/npm-ls.txt || true
          cat /tmp/npm-ls.txt
          ! grep -q "sql.js@" /tmp/npm-ls.txt

      - name: Verify package
        run: npm pack --dry-run

  publish:
    name: Publish to NPM
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to NPM (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run

      - name: Publish to NPM with provenance
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
