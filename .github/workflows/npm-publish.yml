name: Publish to NPM

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the release without publishing
        type: boolean
        default: true

# Releases use npm OIDC trusted publishing, never local credentials.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLATBUFFERS_DIR: ${{ github.workspace }}/../flatbuffers
      WASI_SDK_PATH: /opt/wasi-sdk
      FLATSQL_BUILD_JOBS: '4'
      FLATSQL_CI_RESULTS: ${{ github.workspace }}/ci-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install pinned development tools
        run: npm ci --ignore-scripts --include=dev
      - name: Verify release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(process.env.RELEASE_REF.startsWith('refs/tags/') && process.env.RELEASE_REF!=='refs/tags/v'+p.version) throw Error('Release tag/package version mismatch')"
      - name: Fetch pinned FlatBuffers
        run: |
          git clone --no-checkout https://github.com/DigitalArsenal/flatbuffers.git "$FLATBUFFERS_DIR"
          git -C "$FLATBUFFERS_DIR" checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e
      - name: Install pinned wasi-sdk 30
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          echo '0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  /tmp/wasi-sdk.tar.gz' | sha256sum -c -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Reproduce the committed unified artifact
        run: |
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/flatsql.wasm wasm/integrity.json
      - name: Run short real package and native E2Es
        run: bash scripts/ci-e2e.sh
      - name: Cache Chromium headless shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-linux-playwright-1.63.0
      - name: Install Chromium headless shell
        run: npx --yes --package playwright@1.63.0 playwright install --with-deps chromium-headless-shell
      - name: Browser binary and persistence E2E
        env:
          FLATSQL_BROWSER_RESULTS: ${{ github.workspace }}/ci-results/browser
        run: npm run test:browser
      - name: Verify committed browser/runtime assets
        run: git diff --exit-code -- wasm/runtime docs/assets/unified
      - name: Publish results
        if: always()
        run: |
          if [ -f "$FLATSQL_CI_RESULTS/summary.md" ]; then cat "$FLATSQL_CI_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-e2e-results
          path: |
            ci-results
            wasm/flatsql.wasm
            wasm/integrity.json
      - name: Dry run package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run
      - name: Publish with npm provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: npm publish --access public --provenance
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            wasm/flatsql.wasm
            wasm/integrity.json
