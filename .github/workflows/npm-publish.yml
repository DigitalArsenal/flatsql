name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: "false"
        type: boolean

# Publish `flatsql` to npm only from GitHub Actions via OIDC trusted publishing.
# Do not attempt local `npm publish` for this package from developer machines.
# NPM provenance / trusted publishing needs id-token: write, which only the
# publish job holds (security audit SEC-042/SEC-044); every other job reads.
permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build TypeScript
        run: npm run build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: "4.0.23"
          actions-cache-folder: "emsdk-cache"

      - name: Clone FlatBuffers (DigitalArsenal pin)
        run: |
          git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
          git -C ../flatbuffers checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e

      - name: Build WASM
        working-directory: cpp
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --config Release

      - name: Copy WASM to dist
        run: |
          mkdir -p wasm
          mkdir -p sdm
          cp cpp/build-wasm/flatsql.js wasm/ || true
          cp cpp/build-wasm/flatsql.wasm wasm/ || true
          cp cpp/build-wasm/flatsql-wasi.wasm wasm/ || true
          cp cpp/build-wasm/flatsql-spatial.wasm sdm/ || true

      # The wasi-threads artifacts (the partition store, A34, and store format
      # 4): wasi-sdk 30, the same pinned flatbuffers. The published bytes must
      # be the committed bytes, so a release commit carries the artifacts its
      # sources build.
      - name: Install wasi-sdk 30
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          echo "0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          cat /opt/wasi-sdk/VERSION

      - name: Build flatsql-ps-threads.wasm and flatsql-p4-threads.wasm, check imports, write integrity.json
        env:
          WASI_SDK_PATH: /opt/wasi-sdk
          FLATSQL_BUILD_JOBS: '4'
        run: bash scripts/build-wasm.sh --ps

      - name: The published artifacts are the committed artifacts
        run: |
          sha256sum wasm/flatsql-ps-threads.wasm wasm/flatsql-p4-threads.wasm
          git diff --exit-code --stat -- wasm/flatsql-ps-threads.wasm wasm/flatsql-p4-threads.wasm
          node -e "const j=require('./wasm/integrity.json');for(const f of ['flatsql-ps-threads.wasm','flatsql-p4-threads.wasm'])console.log(f,JSON.stringify(j.files[f]))"

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/
          ls -la wasm/ || true
          ls -la sdm/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            dist/
            wasm/
            sdm/
            package.json
            README.md
            LICENSE
          retention-days: 1

  test:
    name: Test Package
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Run WASI tests
        run: npm run test:wasi

      - name: Check import surfaces and integrity.json
        run: |
          npm run check:imports
          npm run check:integrity

      - name: No sql.js in the package's dependency tree
        run: |
          test "$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")" = "0"
          npm ls sql.js --omit=dev --omit=peer --omit=optional --all > /tmp/npm-ls.txt || true
          cat /tmp/npm-ls.txt
          ! grep -q "sql.js@" /tmp/npm-ls.txt

      - name: Verify package
        run: npm pack --dry-run

  publish:
    name: Publish to NPM
    # Publishes with npm provenance: only from a v* tag or main, in the
    # npm-publish environment (owner's required reviewers). npm's trusted
    # publisher for flatsql should require this environment.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: npm-publish
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance / trusted publishing
    needs: [build, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to NPM (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run

      - name: Publish to NPM with provenance
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public --provenance

      # The GitHub CLI with this job's token, not a third-party action holding
      # contents: write.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
