name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege (security audit SEC-042/SEC-044): the workflow token gets
# nothing by default and every job names exactly the scopes it needs.
permissions: {}

jobs:
  # Supply-chain gate on the workflows themselves (security audit
  # SEC-042/SEC-044): SHA-pinned actions, least-privilege tokens, no curl|sh,
  # no persisted checkout credentials, publish secrets only in environments.
  workflow-hardening:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"
    - name: Check workflow hardening
      run: |
        node scripts/check-workflow-hardening.mjs
        node --test scripts/check-workflow-hardening.test.mjs

  build-and-test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libssl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake

    - name: Clone FlatBuffers
      run: |
        # The same pinned commit npm-publish.yml builds against, never the
        # moving default branch (security audit SEC-042).
        git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
        git -C ../flatbuffers checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e

    - name: Configure CMake
      working-directory: cpp
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      working-directory: cpp
      run: cmake --build build --config Debug -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Tests
      working-directory: cpp/build
      run: ctest --output-on-failure -C Debug

  build-wasm:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
      with:
        version: '4.0.23'

    - name: Clone FlatBuffers (DigitalArsenal pin)
      run: |
        git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
        git -C ../flatbuffers checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e

    - name: Configure WASM Build
      working-directory: cpp
      run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

    - name: Build WASM
      working-directory: cpp
      run: cmake --build build-wasm --config Release

    - name: Verify WASM Output
      run: |
        ls -la cpp/build-wasm/flatsql.js cpp/build-wasm/flatsql.wasm cpp/build-wasm/flatsql-wasi.wasm
        echo "WASM build successful!"

    # npm-publish.yml publishes this build's flatsql.js, flatsql.wasm and
    # flatsql-wasi.wasm and checks them against the committed integrity.json.
    - name: The committed artifacts are this source's build
      run: |
        sha256sum cpp/build-wasm/flatsql.js cpp/build-wasm/flatsql.wasm \
          cpp/build-wasm/flatsql-wasi.wasm cpp/build-wasm/flatsql-wasi-noeh.wasm
        for f in flatsql.js flatsql.wasm flatsql-wasi.wasm flatsql-wasi-noeh.wasm; do
          if ! cmp -s "cpp/build-wasm/$f" "wasm/$f"; then
            echo "::warning::wasm/$f differs from this commit's build; a release commit must carry the rebuilt artifacts and integrity.json"
          fi
        done

  # The partition store artifact (docs/PARTITION-STORE-WASM.md): build it with
  # the pinned wasi-sdk and DigitalArsenal flatbuffers, check its import
  # surface, and run the native suites, 1,000 fault crashes, host-level crashes
  # and the parity vectors under the Node wasi-threads host.
  ps-wasm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      WASI_SDK_PATH: /opt/wasi-sdk
      FLATSQL_BUILD_JOBS: '4'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    - name: Install wasi-sdk 30, ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake
        curl -fsSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
        echo "0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
        sudo mkdir -p /opt/wasi-sdk
        sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
        cat /opt/wasi-sdk/VERSION

    - name: Clone FlatBuffers (DigitalArsenal pin)
      run: |
        git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
        git -C ../flatbuffers checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build flatsql-ps-threads.wasm and the wasm test commands
      run: bash scripts/build-wasm.sh --ps-tests

    - name: The committed artifact is this source's build
      run: |
        if ! git diff --quiet -- wasm/flatsql-ps-threads.wasm; then
          echo "::warning::wasm/flatsql-ps-threads.wasm differs from this commit's build; a release commit must carry the rebuilt artifact (npm-publish.yml refuses otherwise)"
        fi
        sha256sum wasm/flatsql-ps-threads.wasm

    - name: Native partition store test binary (parity vectors)
      working-directory: cpp
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFLATBUFFERS_DIR=$GITHUB_WORKSPACE/../flatbuffers
        cmake --build build --target flatsql_ps_test -j 4

    - name: Partition store tests under the Node host
      env:
        FLATSQL_PS_WASM_SUITE: '1'
      run: >
        node --experimental-wasm-exnref --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
        --runTestsByPath test/standalone-wasm-imports.test.ts test/package-exports.test.ts
        test/ps-node-threads.test.ts test/ps-host-fault.test.ts test/ps-parity-vectors.test.ts

    - name: Cache the patched WasmEdge runtime (space-data-module-sdk C runner)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/sdm-wasmedge-runtimes
        key: sdm-wasmedge-0.16.4-${{ runner.os }}-${{ hashFiles('node_modules/space-data-module-sdk/src/testing/native/wasmedge-0.16.4-atomic-wait.patch') }}

    - name: Deterministic parity under the SDK WasmEdge C runner
      env:
        FLATSQL_PS_WASMEDGE: '1'
        # The SDK compiles its runner with clang-only warning flags.
        CC: clang
      run: >
        node --experimental-wasm-exnref --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
        --runTestsByPath test/ps-parity-vectors.test.ts -t 'C runner'

  # Store format 4 (docs/STORE-FORMAT-4.md): the native engine suite with the
  # kill -9 loop, the SQL surface's own suite (format 1 as the oracle) when it
  # is in the tree, and flatsql-p4-threads.wasm: its import surface, the
  # suite and the kill loop under the Node wasi-threads host.
  p4:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      WASI_SDK_PATH: /opt/wasi-sdk
      FLATSQL_BUILD_JOBS: '4'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'

    - name: Install wasi-sdk 30, ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake
        curl -fsSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
        echo "0507679dff16814b74516cd969a9b16d2ced1347388024bc7966264648c78bfb  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
        sudo mkdir -p /opt/wasi-sdk
        sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1

    - name: Clone FlatBuffers (DigitalArsenal pin)
      run: |
        git clone https://github.com/DigitalArsenal/flatbuffers.git ../flatbuffers
        git -C ../flatbuffers checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e

    - name: Native engine suite, 300 kill -9 rounds, 200 power-loss rounds
      working-directory: cpp
      run: |
        cmake -B build-p4 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFLATBUFFERS_DIR=$GITHUB_WORKSPACE/../flatbuffers
        cmake --build build-p4 --target flatsql_p4_test flatsql_p4_fault_test -j 4
        ./build-p4/flatsql_p4_test
        ./build-p4/flatsql_p4_test --test=t_kill --rounds=300 --seed=$GITHUB_RUN_NUMBER
        ./build-p4/flatsql_p4_fault_test --test=t_power_loss --slow=1 --rounds=200 --seed=$GITHUB_RUN_NUMBER

    - name: The SQL surface is built in (its engine-backed tests ran in the suite above)
      run: |
        # The p4 engine ships with the SQL surface: without cpp/src/p4sql its
        # weak defaults answer ops 30/31 with P4_E_UNSUPPORTED. Fail, never skip.
        ls cpp/src/p4sql/*.cpp >/dev/null 2>&1 || { echo "::error::cpp/src/p4sql is absent: the p4 engine ships with the SQL surface"; exit 1; }
        ls cpp/tests/p4sql/*.cpp >/dev/null 2>&1 || { echo "::error::cpp/tests/p4sql has no engine-backed SQL tests"; exit 1; }

    - name: Install dependencies (the Node host imports space-data-module-sdk)
      run: npm ci --ignore-scripts

    - name: Build the wasi-threads artifacts and test commands
      run: bash scripts/build-wasm.sh --ps-tests

    - name: The committed artifact is this source's build
      run: |
        if ! git diff --quiet -- wasm/flatsql-p4-threads.wasm; then
          echo "::warning::wasm/flatsql-p4-threads.wasm differs from this commit's build; a release commit must carry the rebuilt artifact (npm-publish.yml refuses otherwise)"
        fi
        sha256sum wasm/flatsql-p4-threads.wasm

    - name: The engine suite and 100 kill rounds under the Node host
      run: node scripts/p4-wasm-suite.mjs --kill-rounds 100
