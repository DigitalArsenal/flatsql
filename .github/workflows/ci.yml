name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      FLATSQL_CI_RESULTS: ${{ github.workspace }}/ci-results
      FLATBUFFERS_DIR: ${{ github.workspace }}/../flatbuffers
      FLATSQL_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Fetch pinned FlatBuffers
        run: |
          git clone --no-checkout https://github.com/DigitalArsenal/flatbuffers.git "$FLATBUFFERS_DIR"
          git -C "$FLATBUFFERS_DIR" checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e
      - name: Run short real-engine E2Es
        run: bash scripts/ci-e2e.sh
      - name: Cache Chromium headless shell
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-shell-linux-playwright-1.63.0
      - name: Install Chromium headless shell
        if: runner.os == 'Linux'
        run: npx --yes --package playwright@1.63.0 playwright install --with-deps chromium-headless-shell
      - name: Browser binary and persistence E2E
        if: runner.os == 'Linux'
        env:
          FLATSQL_BROWSER_RESULTS: ${{ github.workspace }}/ci-results/browser
        run: npm run test:browser
      - name: Publish test results
        if: always()
        run: |
          if [ -f "$FLATSQL_CI_RESULTS/summary.md" ]; then
            cat "$FLATSQL_CI_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}
          path: ${{ github.workspace }}/ci-results
          if-no-files-found: warn
