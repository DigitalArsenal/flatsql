name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      FLATSQL_CI_RESULTS: ${{ runner.temp }}/flatsql-ci
      FLATBUFFERS_DIR: ${{ github.workspace }}/../flatbuffers
      FLATSQL_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Fetch pinned FlatBuffers
        run: |
          git clone --no-checkout https://github.com/DigitalArsenal/flatbuffers.git "$FLATBUFFERS_DIR"
          git -C "$FLATBUFFERS_DIR" checkout 8af3053eb8400de4a0a654805b8257e93fae3a8e
      - name: Run short real-engine E2Es
        run: bash scripts/ci-e2e.sh
      - name: Publish test results
        if: always()
        run: |
          if [ -f "$FLATSQL_CI_RESULTS/summary.md" ]; then
            cat "$FLATSQL_CI_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.os }}
          path: ${{ runner.temp }}/flatsql-ci
          if-no-files-found: warn
